pr:
- main

pool:
  vmImage: ubuntu-latest

# Optional: speed up installs with caching
variables:
  node_version: '18.x'

steps:
- checkout: self

- task: NodeTool@0
  inputs:
    versionSpec: '$(node_version)'
  displayName: 'Install Node.js'

- task: Npm@1
  inputs:
    command: 'install'
  # npm ci is faster and reproducible for CI

- script: npm run build
  displayName: 'Build project'


