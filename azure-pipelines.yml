pr:
- main

pool:
  vmImage: ubuntu-latest

# Optional: speed up installs with caching
variables:
  node_version: '18.x'

steps:
- checkout: self

- task: NodeTool@0
  inputs:
    versionSpec: '$(node_version)'
  displayName: 'Install Node.js'

- script: npm ci
  displayName: 'Install dependencies (clean)'
  # npm ci is faster and reproducible for CI

- script: npm run build
  displayName: 'Build project'

- script: npm test --silent
  displayName: 'Run tests'
