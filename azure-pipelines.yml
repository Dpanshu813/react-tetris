trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
- group: vg-tetris
- name: node_version
  value: '18.x'
- name: build_dir
  value: 'build'
- name: artifact_name
  value: 'drop'

stages:
# ======================
# CI Stage: Build + Artifact
# ======================
- stage: CI
  displayName: 'CI - Build & Package'
  jobs:
  - job: BuildPublish
    steps:
    - checkout: self

    - task: NodeTool@0
      inputs:
        versionSpec: '$(node_version)'
      displayName: 'Install Node.js'

    - task: Npm@1
      inputs:
        command: 'install'
      displayName: 'Install dependencies'

    - script: npm run build
      displayName: 'Build React app'

    - task: ArchiveFiles@2
      inputs:
        rootFolderOrFile: '$(build_dir)'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/react-build.zip'
        replaceExistingArchive: true
      displayName: 'Archive build output'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: '$(artifact_name)'
      displayName: 'Publish artifact'

# ======================
# CD Stage: Deploy Dev
# ======================
- stage: Deploy_Dev
  displayName: 'CD - Deploy DEV'
  dependsOn: CI
  condition: succeeded()
  jobs:
  - deployment: DeployDev
    environment: dp_dev
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: '$(artifact_name)'

          - task: AzureWebApp@1
            displayName: 'Deploy to DEV'
            inputs:
              azureSubscription: Azure-Tetris
              appType: webAppLinux
              appName: $(webAppNameDev)
              package: '$(Pipeline.Workspace)/$(artifact_name)/react-build.zip'

# ======================
# CD Stage: Deploy Prod (Approval)
# ======================
- stage: Deploy_Prod
  displayName: 'CD - Deploy PROD (Approval)'
  dependsOn: Deploy_Dev
  condition: succeeded()
  jobs:
  - deployment: DeployProd
    environment: dp_prod
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: '$(artifact_name)'

          - task: AzureWebApp@1
            displayName: 'Deploy to PROD'
            inputs:
              azureSubscription: Azure-Tetris
              appType: webAppLinux
              appName: $(webAppNameProd)
              package: '$(Pipeline.Workspace)/$(artifact_name)/react-build.zip'
